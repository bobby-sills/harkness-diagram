<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Harkness Spiderweb</title>
<meta name="description" content="Map who speaks to whom during a Harkness discussion. Tap each speaker to draw the spiderweb, tag contributions, and review participation.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40"%3E%3Ccircle cx="20" cy="20" r="15" fill="#CFAE82" stroke="#9A7246" stroke-width="2"/%3E%3Cpath d="M20 5L34.27 15.36 M20 5L28.82 32.14 M20 5L11.18 32.14 M20 5L5.73 15.36 M34.27 15.36L28.82 32.14 M34.27 15.36L11.18 32.14 M34.27 15.36L5.73 15.36 M28.82 32.14L11.18 32.14 M28.82 32.14L5.73 15.36 M11.18 32.14L5.73 15.36" stroke="#2A4A8F" stroke-width="1.5" stroke-linecap="round" fill="none"/%3E%3Ccircle cx="20" cy="5" r="3.4" fill="#F5C518" stroke="#FFFFFF" stroke-width="1.4"/%3E%3Ccircle cx="34.27" cy="15.36" r="3.4" fill="#1B2624" stroke="#FFFFFF" stroke-width="1.4"/%3E%3Ccircle cx="28.82" cy="32.14" r="3.4" fill="#1B2624" stroke="#FFFFFF" stroke-width="1.4"/%3E%3Ccircle cx="11.18" cy="32.14" r="3.4" fill="#1B2624" stroke="#FFFFFF" stroke-width="1.4"/%3E%3Ccircle cx="5.73" cy="15.36" r="3.4" fill="#1B2624" stroke="#FFFFFF" stroke-width="1.4"/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500&display=swap">
<link rel="stylesheet" href="styles.css">
<script>try{var t=localStorage.getItem("harkness.theme");if(t==="light"||t==="dark")document.documentElement.setAttribute("data-theme",t);}catch(e){}</script>
</head>
<body>
<header class="bar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="15" fill="var(--table)" stroke="var(--table-edge)" stroke-width="2"/>
      <path d="M20 5L34.27 15.36 M20 5L28.82 32.14 M20 5L11.18 32.14 M20 5L5.73 15.36 M34.27 15.36L28.82 32.14 M34.27 15.36L11.18 32.14 M34.27 15.36L5.73 15.36 M28.82 32.14L11.18 32.14 M28.82 32.14L5.73 15.36 M11.18 32.14L5.73 15.36" stroke="var(--web)" stroke-width="1.5" stroke-linecap="round" fill="none"/>
      <circle cx="20" cy="5" r="3.4" fill="var(--hl)" stroke="var(--seat)" stroke-width="1.4"/>
      <circle cx="34.27" cy="15.36" r="3.4" fill="var(--ink)" stroke="var(--seat)" stroke-width="1.4"/>
      <circle cx="28.82" cy="32.14" r="3.4" fill="var(--ink)" stroke="var(--seat)" stroke-width="1.4"/>
      <circle cx="11.18" cy="32.14" r="3.4" fill="var(--ink)" stroke="var(--seat)" stroke-width="1.4"/>
      <circle cx="5.73" cy="15.36" r="3.4" fill="var(--ink)" stroke="var(--seat)" stroke-width="1.4"/>
    </svg>
    <div class="brand-text">
      <label for="title" class="sr-only">Discussion title</label>
      <input id="title" class="title-input" type="text" autocomplete="off" spellcheck="false">
      <div class="meta"><span id="date"></span></div>
    </div>
  </div>

  <div class="timer" aria-label="Discussion timer">
    <span id="clock" class="clock mono">00:00</span>
    <button id="timer-btn" class="btn btn-quiet" type="button">Start timer</button>
    <button id="timer-reset" class="btn btn-quiet btn-icon" type="button" title="Reset timer" aria-label="Reset timer">↺</button>
  </div>

  <div class="seg" role="group" aria-label="Mode">
    <button id="mode-record" class="seg-btn" type="button" aria-pressed="true">Record</button>
    <button id="mode-arrange" class="seg-btn" type="button" aria-pressed="false">Arrange seats</button>
  </div>

  <div class="actions">
    <button id="help-btn" class="btn btn-icon help-btn" type="button" aria-label="Show the tour" title="Show the tour">?</button>
    <button id="theme-btn" class="btn btn-icon theme-btn" type="button" aria-pressed="false" aria-label="Switch to dark mode" title="Switch to dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg>
    </button>
    <button id="undo" class="btn" type="button" title="Undo last turn (Ctrl+Z)">Undo</button>
    <button id="export-png" class="btn" type="button">Save image</button>
    <button id="new-btn" class="btn btn-primary" type="button">New discussion</button>
  </div>
</header>

<main class="layout">
  <section class="stage" aria-label="Table">
    <p id="hint" class="hint"></p>
    <div class="board-wrap" id="board-wrap">
      <svg id="board" viewBox="0 0 1000 720" role="group" aria-label="Spiderweb map of the discussion"></svg>
    </div>

    <div class="tagbar" id="tagbar">
      <div class="latest" id="latest">No turns yet</div>
      <div class="tags" role="group" aria-label="Tag the latest turn" id="tag-buttons"></div>
    </div>

    <div class="replay">
      <label for="replay">Replay</label>
      <input id="replay" type="range" min="0" max="0" value="0" step="1">
      <span id="replay-label" class="mono replay-label"></span>
      <button id="replay-live" class="btn btn-sm btn-quiet" type="button" hidden>Back to live</button>
    </div>
  </section>

  <aside class="panel">
    <div class="tabs" role="tablist" aria-label="Panels">
      <button class="tab" role="tab" id="tab-btn-summary" aria-controls="tab-summary" aria-selected="true" data-tab="summary">Summary</button>
      <button class="tab" role="tab" id="tab-btn-log" aria-controls="tab-log" aria-selected="false" data-tab="log">Log</button>
      <button class="tab" role="tab" id="tab-btn-roster" aria-controls="tab-roster" aria-selected="false" data-tab="roster">Roster</button>
      <button class="tab" role="tab" id="tab-btn-saved" aria-controls="tab-saved" aria-selected="false" data-tab="saved">Saved</button>
    </div>

    <div class="tab-panel" id="tab-summary" role="tabpanel" aria-labelledby="tab-btn-summary"></div>
    <div class="tab-panel" id="tab-log" role="tabpanel" aria-labelledby="tab-btn-log" hidden></div>
    <div class="tab-panel" id="tab-roster" role="tabpanel" aria-labelledby="tab-btn-roster" hidden>
      <form id="add-form" class="add-form">
        <label for="add-name" class="sr-only">Participant name</label>
        <input id="add-name" type="text" placeholder="Add a participant" autocomplete="off">
        <button class="btn btn-primary" type="submit">Add</button>
      </form>
      <ul id="roster-list" class="roster-list"></ul>
      <div class="roster-tools">
        <button id="spread" class="btn" type="button">Spread seats evenly</button>
        <button id="shuffle" class="btn" type="button">Shuffle seating</button>
      </div>
      <details class="bulk">
        <summary>Paste a whole class list</summary>
        <label for="bulk-names" class="sr-only">Names, one per line or separated by commas</label>
        <textarea id="bulk-names" rows="6" placeholder="One name per line, or separated by commas"></textarea>
        <button id="bulk-add" class="btn" type="button">Add these names</button>
      </details>
    </div>
    <div class="tab-panel" id="tab-saved" role="tabpanel" aria-labelledby="tab-btn-saved" hidden>
      <p class="note">Discussions save automatically in this browser.</p>
      <ul id="saved-list" class="saved-list"></ul>
      <div class="file-tools">
        <button id="copy-summary" class="btn" type="button">Copy text summary</button>
        <button id="export-json" class="btn" type="button">Export file</button>
        <label class="btn file-btn" for="import-json">Import file</label>
        <input id="import-json" type="file" accept="application/json,.json" class="sr-only">
      </div>
    </div>
  </aside>
</main>

<div id="modal" class="modal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <h2 id="modal-title"></h2>
    <div id="modal-body" class="modal-body"></div>
    <div id="modal-actions" class="modal-actions"></div>
  </div>
</div>

<div id="tour" class="tour" role="dialog" aria-labelledby="tour-title" aria-describedby="tour-text" hidden>
  <div class="tour-count mono" id="tour-count"></div>
  <h2 id="tour-title" class="tour-title"></h2>
  <p id="tour-text" class="tour-text"></p>
  <div class="tour-actions">
    <button id="tour-skip" class="btn btn-sm btn-quiet" type="button">Skip tour</button>
    <span class="tour-spacer"></span>
    <button id="tour-back" class="btn btn-sm" type="button">Back</button>
    <button id="tour-next" class="btn btn-sm btn-primary" type="button">Next</button>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="app.js"></script>
</body>
</html>
